name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: CompeyDev/setup-rokit@v0.1.2
      - name: Packages Wally
        run: wally install
      - name: Format + Lint + Tests (unit, intégration, non-régression)
        run: ./scripts/test.sh
      - name: Build de la place
        run: rojo build default.project.json -o StudsHarvestTycoon.rbxl
